# Publishes a release: run it from Actions > Release > Run workflow (on main), or push a v* tag.
# It releases the Version in WinImagePrep.csproj and creates the v<version> tag itself.
#   1. builds the app and updater on Windows
#   2. creates the GitHub release (a draft until every file is uploaded) with WinImagePrep_full.exe,
#      the updater and SHA-256 checksums: app 5.9.1 and later update from this
#   3. copies the same files to downloads.andykemp.com (R2 bucket akc-download, win11-image-prep/<version>/),
#      then writes win11-image-prep/latest.json, which app 5.9.5 and later update from.
#      Needs the repo secrets CLOUDFLARE_API_TOKEN (R2 edit) and CLOUDFLARE_ACCOUNT_ID.
#   4. for 5.9.0 and older, commits publish/*.exe AND version.json to main in ONE commit, so their
#      updater never sees a new version before its exe is there (best effort; re-run to finish)
name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          lfs: true

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Read the version (and check a pushed tag matches it)
        id: ver
        shell: pwsh
        run: |
          [xml]$app = Get-Content WinImagePrep/WinImagePrep.csproj
          [xml]$upd = Get-Content WinImagePrep.Updater/WinImagePrep.Updater.csproj
          $appVer = ($app.Project.PropertyGroup | Where-Object Version | Select-Object -First 1).Version.Trim()
          $updVer = ($upd.Project.PropertyGroup | Where-Object Version | Select-Object -First 1).Version.Trim()
          if ("${{ github.ref_type }}" -eq 'tag' -and "${{ github.ref_name }}".TrimStart('v') -ne $appVer) {
            throw "Tag ${{ github.ref_name }} doesn't match WinImagePrep.csproj Version $appVer"
          }
          $draft = gh release view "v$appVer" --json isDraft --jq .isDraft 2>$null
          $global:LASTEXITCODE = 0   # "not found" is the expected answer; don't let it fail the step
          # Already published: skip the release and only finish the older-version publish (re-run).
          # A draft left by a failed run is finished as normal.
          $published = ($draft -eq 'false')
          if ($published) { Write-Host "Release v$appVer is already published; this run only finishes the publish for older versions" }
          "published=$($published.ToString().ToLower())" >> $env:GITHUB_OUTPUT
          "version=$appVer" >> $env:GITHUB_OUTPUT
          "updater=$updVer" >> $env:GITHUB_OUTPUT
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Build
        run: |
          dotnet publish WinImagePrep/WinImagePrep.csproj -c Release -r win-x64 --self-contained -o out/app
          dotnet publish WinImagePrep.Updater/WinImagePrep.Updater.csproj -c Release -r win-x64 --self-contained -o out/updater

      - name: Create GitHub release
        if: steps.ver.outputs.published != 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Force release | Out-Null
          Copy-Item out/app/WinImagePrep.exe release/WinImagePrep_full.exe
          Copy-Item out/updater/WinImagePrep.Updater.exe release/WinImagePrep.Updater.exe
          # The installer (Program Files, for Intune and other deployment tools)
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          & $iscc /Q "/DAppVersion=${{ steps.ver.outputs.version }}" "/DSourceDir=$PWD\out\app" "/DUpdaterDir=$PWD\out\updater" "/O$PWD\release" installer\Win11ImagePrep.iss
          if ($LASTEXITCODE -ne 0) { throw 'Could not build the installer' }
          Get-FileHash release/* -Algorithm SHA256 | ForEach-Object { "$($_.Hash.ToLower())  $(Split-Path $_.Path -Leaf)" } | Set-Content release/SHA256SUMS.txt
          # Release notes: this version's section of CHANGELOG.md
          $log = Get-Content CHANGELOG.md -Raw
          $v = [regex]::Escape("${{ steps.ver.outputs.version }}")
          $m = [regex]::Match($log, "(?s)## \[$v\][^\n]*\n(.*?)(?=\n---|\n## \[)")
          $notes = if ($m.Success) { $m.Groups[1].Value.Trim() } else { "See CHANGELOG.md" }
          $notes += "`n`nDownload **WinImagePrep_full.exe** (single file, no install) or **Win11ImagePrep_Setup.exe** (installs to Program Files; silent with /VERYSILENT for Intune). Check them against SHA256SUMS.txt.`n`nDocs: https://docs.andykemp.com/win11-image-prep/"
          Set-Content release-notes.md $notes
          $sha = git rev-parse HEAD   # the source commit this release was built from
          function Upload-WithRetry($tag) {
            foreach ($f in Get-ChildItem release -File) {
              $ok = $false
              for ($i = 1; $i -le 4 -and -not $ok; $i++) {
                gh release upload $tag $f.FullName --clobber
                if ($LASTEXITCODE -eq 0) { $ok = $true } else { Write-Host "Upload of $($f.Name) failed (attempt $i); retrying"; Start-Sleep -Seconds (10 * $i) }
              }
              if (-not $ok) { throw "Could not upload $($f.Name)" }
            }
            $global:LASTEXITCODE = 0
          }
          # Draft first, upload every file with retries, then publish: the app never sees a half-uploaded release
          $tag = "v${{ steps.ver.outputs.version }}"
          gh release view $tag *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --draft --target $sha --title "Win11 Image Prep ${{ steps.ver.outputs.version }}" --notes-file release-notes.md
            if ($LASTEXITCODE -ne 0) { throw 'Could not create the draft release' }
          }
          Upload-WithRetry $tag
          gh release edit $tag --draft=false --latest
          if ($LASTEXITCODE -ne 0) { throw 'Could not publish the release' }

      # downloads.andykemp.com: the files go in first, latest.json last, so the app never sees a version
      # whose files aren't there. Safe to re-run.
      - name: Publish to downloads.andykemp.com (R2)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if (-not $env:CLOUDFLARE_API_TOKEN -or -not $env:CLOUDFLARE_ACCOUNT_ID) {
            Write-Host '::warning::CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID is not set, so nothing was published to downloads.andykemp.com'
            exit 0
          }
          $ver = "${{ steps.ver.outputs.version }}"
          $bucket = 'akc-download'
          $prefix = "win11-image-prep/$ver"
          New-Item -ItemType Directory -Force r2 | Out-Null
          gh release download "v$ver" -D r2 -p WinImagePrep_full.exe -p WinImagePrep.Updater.exe -p Win11ImagePrep_Setup.exe -p SHA256SUMS.txt --clobber
          if ($LASTEXITCODE -ne 0) { throw "Could not download the v$ver release files" }
          function Put($key, $file, $type, $cache) {
            for ($i = 1; $i -le 4; $i++) {
              npx --yes wrangler@4 r2 object put "$bucket/$key" --file $file --content-type $type --cache-control $cache --remote
              if ($LASTEXITCODE -eq 0) { return }
              Write-Host "Upload of $key failed (attempt $i); retrying"; Start-Sleep -Seconds (10 * $i)
            }
            throw "Could not upload $key"
          }
          Put "$prefix/WinImagePrep_full.exe" r2/WinImagePrep_full.exe 'application/vnd.microsoft.portable-executable' 'public, max-age=31536000, immutable'
          Put "$prefix/WinImagePrep.Updater.exe" r2/WinImagePrep.Updater.exe 'application/vnd.microsoft.portable-executable' 'public, max-age=31536000, immutable'
          if (Test-Path r2/Win11ImagePrep_Setup.exe) {
            Put "$prefix/Win11ImagePrep_Setup.exe" r2/Win11ImagePrep_Setup.exe 'application/vnd.microsoft.portable-executable' 'public, max-age=31536000, immutable'
          }
          # version.json for the downloads page, then SHA256SUMS.txt, which marks the version as published there
          $appSha = ((Get-Content r2/SHA256SUMS.txt | Where-Object { $_ -match 'WinImagePrep_full\.exe$' }) -split '\s+')[0]
          [ordered]@{ version = $ver; file = 'WinImagePrep_full.exe'; sha256 = $appSha; published = (Get-Date).ToUniversalTime().ToString('yyyy-MM-ddTHH:mm:ssZ') } |
            ConvertTo-Json | Set-Content r2/version.json -Encoding utf8NoBOM
          Put "$prefix/version.json" r2/version.json 'application/json' 'public, max-age=300'
          Put "$prefix/SHA256SUMS.txt" r2/SHA256SUMS.txt 'text/plain; charset=utf-8' 'public, max-age=31536000, immutable'
          $sums = @{}
          foreach ($line in Get-Content r2/SHA256SUMS.txt) { $h, $n = $line -split '\s+', 2; $sums[$n.Trim()] = $h }
          $base = "https://downloads.andykemp.com/$prefix"
          $log = Get-Content CHANGELOG.md -Raw
          $m = [regex]::Match($log, "(?s)## \[$([regex]::Escape($ver))\][^\n]*\n(.*?)(?=\n---|\n## \[)")
          [ordered]@{
            name           = 'Win11 Image Prep'
            version        = $ver
            updaterVersion = "${{ steps.ver.outputs.updater }}"
            releaseDate    = (Get-Date -Format 'yyyy-MM-dd')
            app            = [ordered]@{ file = 'WinImagePrep_full.exe'; url = "$base/WinImagePrep_full.exe"; sha256 = $sums['WinImagePrep_full.exe']; size = (Get-Item r2/WinImagePrep_full.exe).Length }
            updater        = [ordered]@{ file = 'WinImagePrep.Updater.exe'; url = "$base/WinImagePrep.Updater.exe"; sha256 = $sums['WinImagePrep.Updater.exe']; size = (Get-Item r2/WinImagePrep.Updater.exe).Length }
            setup          = $(if (Test-Path r2/Win11ImagePrep_Setup.exe) { [ordered]@{ file = 'Win11ImagePrep_Setup.exe'; url = "$base/Win11ImagePrep_Setup.exe"; sha256 = $sums['Win11ImagePrep_Setup.exe']; size = (Get-Item r2/Win11ImagePrep_Setup.exe).Length } } else { $null })
            checksums      = "$base/SHA256SUMS.txt"
            notes          = $(if ($m.Success) { $m.Groups[1].Value.Trim() } else { '' })
            docs           = 'https://docs.andykemp.com/win11-image-prep/'
          } | ConvertTo-Json -Depth 4 | Set-Content r2/latest.json -Encoding utf8NoBOM
          Get-Content r2/latest.json
          # The list of built-in apps the app offers to remove (it keeps a cached copy if this can't be reached)
          Put 'win11-image-prep/app-list.json' app-list.json 'application/json' 'public, max-age=3600'
          Put 'win11-image-prep/latest.json' r2/latest.json 'application/json' 'no-cache'

      # For app versions 5.9.0 and older, which update from version.json and publish/ on main.
      # Best effort: 5.9.1 and later update from the GitHub release above, so a failure here
      # (such as a Git LFS outage) doesn't stop the release; re-run the workflow later to finish it.
      - name: Publish binaries and version.json to main for older versions (one commit)
        shell: pwsh
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Use the release's own files, so older versions get exactly what the release has
          $tag = "v${{ steps.ver.outputs.version }}"
          New-Item -ItemType Directory -Force dl | Out-Null
          gh release download $tag -D dl -p WinImagePrep_full.exe -p WinImagePrep.Updater.exe --clobber
          if ($LASTEXITCODE -ne 0) { throw "Could not download the $tag release files" }
          Copy-Item dl/WinImagePrep_full.exe publish/WinImagePrep.exe -Force
          Copy-Item dl/WinImagePrep.Updater.exe publish/WinImagePrep.Updater.exe -Force
          [ordered]@{
            version        = "${{ steps.ver.outputs.version }}"
            updaterVersion = "${{ steps.ver.outputs.updater }}"
            releaseDate    = (Get-Date -Format 'yyyy-MM-dd')
            releaseNotes   = "See docs.andykemp.com/win11-image-prep/whats-new/"
          } | ConvertTo-Json | Set-Content version.json -Encoding utf8NoBOM
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git lfs install --local
          git add publish/WinImagePrep.exe publish/WinImagePrep.Updater.exe version.json
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) {
            Write-Host 'Binaries and version.json already published (re-run); nothing to commit'
            $global:LASTEXITCODE = 0
          } else {
            git commit -m "Publish Win11 Image Prep ${{ steps.ver.outputs.version }} binary"
            $pushed = $false
            for ($i = 1; $i -le 3 -and -not $pushed; $i++) {
              git push origin HEAD:main
              if ($LASTEXITCODE -eq 0) { $pushed = $true } else { Write-Host "Push failed (attempt $i); retrying"; Start-Sleep -Seconds (20 * $i) }
            }
            if (-not $pushed) { throw 'Could not publish to main for older versions; re-run the workflow later' }
          }
