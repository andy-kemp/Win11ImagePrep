# Publishes a release: run it from Actions > Release > Run workflow (on main), or push a v* tag.
# It releases the Version in WinImagePrep.csproj and creates the v<version> tag itself.
#   1. builds the app and updater on Windows
#   2. creates the GitHub release (a draft until every file is uploaded) with WinImagePrep_full.exe,
#      the updater and SHA-256 checksums: app 5.9.1 and later update from this
#   3. for 5.9.0 and older, commits publish/*.exe AND version.json to main in ONE commit, so their
#      updater never sees a new version before its exe is there (best effort; re-run to finish)
name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          lfs: true

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Read the version (and check a pushed tag matches it)
        id: ver
        shell: pwsh
        run: |
          [xml]$app = Get-Content WinImagePrep/WinImagePrep.csproj
          [xml]$upd = Get-Content WinImagePrep.Updater/WinImagePrep.Updater.csproj
          $appVer = ($app.Project.PropertyGroup | Where-Object Version | Select-Object -First 1).Version.Trim()
          $updVer = ($upd.Project.PropertyGroup | Where-Object Version | Select-Object -First 1).Version.Trim()
          if ("${{ github.ref_type }}" -eq 'tag' -and "${{ github.ref_name }}".TrimStart('v') -ne $appVer) {
            throw "Tag ${{ github.ref_name }} doesn't match WinImagePrep.csproj Version $appVer"
          }
          $draft = gh release view "v$appVer" --json isDraft --jq .isDraft 2>$null
          $global:LASTEXITCODE = 0   # "not found" is the expected answer; don't let it fail the step
          # Already published: skip the release and only finish the older-version publish (re-run).
          # A draft left by a failed run is finished as normal.
          $published = ($draft -eq 'false')
          if ($published) { Write-Host "Release v$appVer is already published; this run only finishes the publish for older versions" }
          "published=$($published.ToString().ToLower())" >> $env:GITHUB_OUTPUT
          "version=$appVer" >> $env:GITHUB_OUTPUT
          "updater=$updVer" >> $env:GITHUB_OUTPUT
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Build
        run: |
          dotnet publish WinImagePrep/WinImagePrep.csproj -c Release -r win-x64 --self-contained -o out/app
          dotnet publish WinImagePrep.Updater/WinImagePrep.Updater.csproj -c Release -r win-x64 --self-contained -o out/updater

      - name: Create GitHub release
        if: steps.ver.outputs.published != 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Force release | Out-Null
          Copy-Item out/app/WinImagePrep.exe release/WinImagePrep_full.exe
          Copy-Item out/updater/WinImagePrep.Updater.exe release/WinImagePrep.Updater.exe
          Get-FileHash release/* -Algorithm SHA256 | ForEach-Object { "$($_.Hash.ToLower())  $(Split-Path $_.Path -Leaf)" } | Set-Content release/SHA256SUMS.txt
          # Release notes: this version's section of CHANGELOG.md
          $log = Get-Content CHANGELOG.md -Raw
          $v = [regex]::Escape("${{ steps.ver.outputs.version }}")
          $m = [regex]::Match($log, "(?s)## \[$v\][^\n]*\n(.*?)(?=\n---|\n## \[)")
          $notes = if ($m.Success) { $m.Groups[1].Value.Trim() } else { "See CHANGELOG.md" }
          $notes += "`n`nDownload **WinImagePrep_full.exe** (single file, no install). Check it against SHA256SUMS.txt.`n`nDocs: https://docs.andykemp.com/win11-image-prep/"
          Set-Content release-notes.md $notes
          $sha = git rev-parse HEAD   # the source commit this release was built from
          function Upload-WithRetry($tag) {
            foreach ($f in Get-ChildItem release -File) {
              $ok = $false
              for ($i = 1; $i -le 4 -and -not $ok; $i++) {
                gh release upload $tag $f.FullName --clobber
                if ($LASTEXITCODE -eq 0) { $ok = $true } else { Write-Host "Upload of $($f.Name) failed (attempt $i); retrying"; Start-Sleep -Seconds (10 * $i) }
              }
              if (-not $ok) { throw "Could not upload $($f.Name)" }
            }
            $global:LASTEXITCODE = 0
          }
          # Draft first, upload every file with retries, then publish: the app never sees a half-uploaded release
          $tag = "v${{ steps.ver.outputs.version }}"
          gh release view $tag *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --draft --target $sha --title "Win11 Image Prep ${{ steps.ver.outputs.version }}" --notes-file release-notes.md
            if ($LASTEXITCODE -ne 0) { throw 'Could not create the draft release' }
          }
          Upload-WithRetry $tag
          gh release edit $tag --draft=false --latest
          if ($LASTEXITCODE -ne 0) { throw 'Could not publish the release' }

      # For app versions 5.9.0 and older, which update from version.json and publish/ on main.
      # Best effort: 5.9.1 and later update from the GitHub release above, so a failure here
      # (such as a Git LFS outage) doesn't stop the release; re-run the workflow later to finish it.
      - name: Publish binaries and version.json to main for older versions (one commit)
        shell: pwsh
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Use the release's own files, so older versions get exactly what the release has
          $tag = "v${{ steps.ver.outputs.version }}"
          New-Item -ItemType Directory -Force dl | Out-Null
          gh release download $tag -D dl -p WinImagePrep_full.exe -p WinImagePrep.Updater.exe --clobber
          if ($LASTEXITCODE -ne 0) { throw "Could not download the $tag release files" }
          Copy-Item dl/WinImagePrep_full.exe publish/WinImagePrep.exe -Force
          Copy-Item dl/WinImagePrep.Updater.exe publish/WinImagePrep.Updater.exe -Force
          [ordered]@{
            version        = "${{ steps.ver.outputs.version }}"
            updaterVersion = "${{ steps.ver.outputs.updater }}"
            releaseDate    = (Get-Date -Format 'yyyy-MM-dd')
            releaseNotes   = "See docs.andykemp.com/win11-image-prep/whats-new/"
          } | ConvertTo-Json | Set-Content version.json -Encoding utf8NoBOM
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git lfs install --local
          git add publish/WinImagePrep.exe publish/WinImagePrep.Updater.exe version.json
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) {
            Write-Host 'Binaries and version.json already published (re-run); nothing to commit'
            $global:LASTEXITCODE = 0
          } else {
            git commit -m "Publish Win11 Image Prep ${{ steps.ver.outputs.version }} binary"
            $pushed = $false
            for ($i = 1; $i -le 3 -and -not $pushed; $i++) {
              git push origin HEAD:main
              if ($LASTEXITCODE -eq 0) { $pushed = $true } else { Write-Host "Push failed (attempt $i); retrying"; Start-Sleep -Seconds (20 * $i) }
            }
            if (-not $pushed) { throw 'Could not publish to main for older versions; re-run the workflow later' }
          }
