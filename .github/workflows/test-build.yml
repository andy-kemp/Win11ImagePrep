# Builds a test exe for a branch on a Windows runner and publishes it as a GitHub pre-release,
# so a change can be tried on real hardware before it is released.
# Pre-releases are ignored by the app's updater (it reads version.json on main).
name: Test build

on:
  push:
    branches-ignore:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish app
        run: dotnet publish WinImagePrep/WinImagePrep.csproj -c Release -r win-x64 --self-contained -o out/app

      - name: Publish updater
        run: dotnet publish WinImagePrep.Updater/WinImagePrep.Updater.csproj -c Release -r win-x64 --self-contained -o out/updater

      - name: Name the test build
        id: meta
        shell: pwsh
        run: |
          $branch = "${{ github.ref_name }}" -replace '[^A-Za-z0-9._-]', '-'
          $short = "${{ github.sha }}".Substring(0, 7)
          "tag=test-$branch-$short" >> $env:GITHUB_OUTPUT
          New-Item -ItemType Directory -Force release | Out-Null
          Copy-Item out/app/WinImagePrep.exe "release/WinImagePrep_test_$short.exe"
          Copy-Item out/updater/WinImagePrep.Updater.exe release/WinImagePrep.Updater.exe
          Get-FileHash release/* -Algorithm SHA256 | ForEach-Object { "$($_.Hash.ToLower())  $(Split-Path $_.Path -Leaf)" } | Set-Content release/SHA256SUMS.txt
          Get-Content release/SHA256SUMS.txt

      - name: Screenshot the main window
        shell: pwsh
        continue-on-error: true
        run: |
          # Skip first-run and update prompts so the main window opens straight away
          New-Item -ItemType Directory -Force C:\ProgramData\Win11ImagePrep | Out-Null
          '{"FirstRunComplete":true,"FirstRunUpdateCheckComplete":true,"CheckForUpdates":false}' | Set-Content C:\ProgramData\Win11ImagePrep\settings.json
          Add-Type -AssemblyName System.Drawing
          Add-Type @"
          using System; using System.Runtime.InteropServices;
          public static class Win {
            [StructLayout(LayoutKind.Sequential)] public struct RECT { public int L, T, R, B; }
            [DllImport("user32.dll")] public static extern bool GetWindowRect(IntPtr h, out RECT r);
            [DllImport("user32.dll")] public static extern bool PrintWindow(IntPtr h, IntPtr hdc, uint f);
            [DllImport("user32.dll")] public static extern bool MoveWindow(IntPtr h, int x, int y, int w, int hh, bool r);
          }
          "@
          $p = Start-Process -FilePath (Resolve-Path release/WinImagePrep_test_*.exe) -PassThru
          $h = [IntPtr]::Zero
          for ($i = 0; $i -lt 60 -and $h -eq [IntPtr]::Zero; $i++) {
            Start-Sleep -Seconds 1; $p.Refresh()
            if ($p.MainWindowTitle -like 'Win11 Image Prep*' -or $p.MainWindowTitle -like 'Windows Image*') { $h = $p.MainWindowHandle }
          }
          Write-Host "Window: '$($p.MainWindowTitle)'"
          Start-Sleep -Seconds 4
          [Win]::MoveWindow($h, 0, 0, 940, 960, $true) | Out-Null
          Start-Sleep -Seconds 2
          $r = New-Object Win+RECT; [Win]::GetWindowRect($h, [ref]$r) | Out-Null
          $bmp = New-Object System.Drawing.Bitmap ($r.R - $r.L), ($r.B - $r.T)
          $g = [System.Drawing.Graphics]::FromImage($bmp); $hdc = $g.GetHdc()
          [Win]::PrintWindow($h, $hdc, 2) | Out-Null
          $g.ReleaseHdc($hdc); $g.Dispose()
          $bmp.Save("$PWD/release/screenshot-main-window.png", [System.Drawing.Imaging.ImageFormat]::Png)
          Stop-Process -Id $p.Id -Force

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.meta.outputs.tag }}
          path: release/

      - name: Publish pre-release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $notes = "Test build of branch ``${{ github.ref_name }}`` at ${{ github.sha }}. Not a release: for testing only. Check the download against SHA256SUMS.txt."
          gh release create "${{ steps.meta.outputs.tag }}" release/* --prerelease --target "${{ github.sha }}" --title "Test build: ${{ github.ref_name }} (${{ github.sha }})" --notes $notes
