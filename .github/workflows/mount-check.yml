# Temporary: checks the ISO mount script locally and from a network (UNC) path
name: Mount check
on:
  push:
    branches: [iso-local-copy]
    paths: ['.github/workflows/mount-check.yml']
jobs:
  check:
    runs-on: windows-latest
    steps:
      - shell: pwsh
        run: |
          New-Item -ItemType Directory -Force C:\isosrc\sources | Out-Null
          'x' | Set-Content C:\isosrc\sources\boot.wim
          'x' | Set-Content C:\isosrc\sources\install.esd
          $fsi = New-Object -ComObject IMAPI2FS.MsftFileSystemImage
          $fsi.FileSystemsToCreate = 4; $fsi.VolumeName = 'TESTISO'
          $fsi.Root.AddTree('C:\isosrc', $false)
          $res = $fsi.CreateResultImage(); $stream = $res.ImageStream
          Add-Type -TypeDefinition 'using System; using System.IO; using System.Runtime.InteropServices.ComTypes; public static class S { public static void Save(object s, string p){ var i=(IStream)s; using (var f=File.Create(p)){ var b=new byte[65536]; var r=Marshal.AllocHGlobal(4); try { while(true){ i.Read(b,b.Length,r); int n=Marshal.ReadInt32(r); if(n==0)break; f.Write(b,0,n);} } finally { Marshal.FreeHGlobal(r);} } } }' -Language CSharp -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force C:\iso | Out-Null
          [S]::Save($stream, 'C:\iso\t.iso')
          Get-Item C:\iso\t.iso | Format-Table Name, Length
          function MountTest($p) {
            $e = $p.Replace("'", "''")
            $cmd = "`$ErrorActionPreference='Stop'; try { `$img = Get-DiskImage -ImagePath '$e' -ErrorAction SilentlyContinue; if (-not (`$img -and `$img.Attached)) { `$null = Mount-DiskImage -ImagePath '$e' -PassThru -StorageType ISO -Access ReadOnly; Start-Sleep -Seconds 3 }; `$vol = Get-DiskImage -ImagePath '$e' | Get-Volume | Where-Object DriveLetter | Select-Object -First 1; `$driveLetter = `$vol.DriveLetter; if ([string]::IsNullOrEmpty(`$driveLetter)) { throw 'No drive letter assigned' }; Write-Output `$driveLetter; exit 0 } catch { Write-Error `$_.Exception.Message; exit 1 }"
            $out = powershell.exe -NoProfile -Command $cmd 2>&1
            Write-Host "::notice::$p -> exit $LASTEXITCODE : $out"
          }
          MountTest 'C:\iso\t.iso'
          MountTest 'C:\iso\t.iso'   # already mounted: reused
          Dismount-DiskImage -ImagePath 'C:\iso\t.iso' | Out-Null
          New-SmbShare -Name isoshare -Path C:\iso -FullAccess Everyone | Out-Null
          MountTest '\\localhost\isoshare\t.iso'
